<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界史ラボ</title>
<meta name="description" content="歴史総合・世界史探究の授業で使える、年代のツマミを動かすと地図の王朝や人物が変わる世界史の学習アプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 見た目：古い地図帳のイメージ。紙の色の背景、明朝体の見出し、えんじ（アクセント）と藍 */
:root {
  --bg: #f3eee2;
  --panel: #fffdf7;
  --ink: #1f1d1a;
  --muted: #6a645a;
  --line: #dcd2bd;
  --chip: #ece5d4;
  --accent: #8c2f39;
  --accent-ink: #ffffff;
  --ai: #1f4e79;
  --ok: #2c8350;
  --ng: #c0392b;
  --sea: #d6e6ec;
  --land: #efe8d6;
  --land-line: #a99e84;
  --border: rgba(60, 50, 30, .16);
  --grat: rgba(140, 47, 57, 0.07);
  --label: #1f1d1a;
  --halo: rgba(255, 253, 247, .92);
  --fill-op: .5;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --r: 12px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1e1b16; --ink: #ece6da; --muted: #a59d8e; --line: #3a342a; --chip: #2a261f;
    --accent: #e0848d; --accent-ink: #15130f; --ai: #7fb0dc; --ok: #5fd18f; --ng: #ff7b6b;
    --sea: #13212a; --land: #2d2a23; --land-line: #5d5546; --border: rgba(255, 245, 220, .14); --grat: rgba(224, 132, 141, .06);
    --label: #f6f1e6; --halo: rgba(20, 18, 14, .88); --fill-op: .55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1e1b16; --ink: #ece6da; --muted: #a59d8e; --line: #3a342a; --chip: #2a261f;
  --accent: #e0848d; --accent-ink: #15130f; --ai: #7fb0dc; --ok: #5fd18f; --ng: #ff7b6b;
  --sea: #13212a; --land: #2d2a23; --land-line: #5d5546; --border: rgba(255, 245, 220, .14); --grat: rgba(224, 132, 141, .06);
  --label: #f6f1e6; --halo: rgba(20, 18, 14, .88); --fill-op: .55;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  background: var(--bg); min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.35; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* --- 上のバー --- */
.top {
  position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.top-row { display: flex; align-items: center; gap: 12px; }
.brand { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
.brand a { color: inherit; text-decoration: none; }
.brand b { color: var(--accent); }
.brand small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.grpnav { display: flex; gap: 4px; flex-wrap: nowrap; align-items: center; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.grpnav::-webkit-scrollbar { display: none; }
.grpnav .g { border: 1px solid var(--line); background: var(--panel); padding: 5px 13px; border-radius: 999px; font-weight: 700; white-space: nowrap; flex: none; font-size: 14px; }
.grpnav .g[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grpnav .subs { display: inline-flex; gap: 2px; padding: 2px; margin: 0 4px; border-radius: 999px; background: var(--chip); flex: none; }
.grpnav .subs button { border: 0; background: transparent; padding: 4px 11px; border-radius: 999px; font-size: 13.5px; color: var(--muted); white-space: nowrap; font-weight: 600; }
.grpnav .subs button[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 13px; white-space: nowrap; }
@media (max-width: 720px) {
  .brand small, .lbl { display: none; }
  .brand { font-size: 18px; }
  .top { padding-top: 6px; padding-bottom: 6px; }
}

main { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }

/* --- 共通の部品 --- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
button.chip[aria-pressed="true"], button.chip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.muted { color: var(--muted); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.2); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs button { border: 0; background: none; padding: 8px 12px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.keys { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.keys span { background: var(--chip); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.empty { color: var(--muted); padding: 12px; font-size: 14px; }

/* --- 歴史地図 --- */
.hm { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hm-stage { position: relative; flex: 1; min-height: 0; background: var(--sea); }
.hm-stage svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.hm-sea { fill: var(--sea); }
.hm-grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hm-land { fill: var(--land); stroke: var(--land-line); stroke-width: .6; vector-effect: non-scaling-stroke; }
.hm-modern { fill: none; stroke: var(--land-line); stroke-width: .5; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; opacity: .7; }
.hm-pol { fill-opacity: var(--fill-op); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill-opacity .15s; }
.hm-pol:hover { fill-opacity: calc(var(--fill-op) + .15); }
.hm-pol.sel { fill-opacity: calc(var(--fill-op) + .2); stroke-width: 2.6; }
.hm-pol.dim { fill-opacity: calc(var(--fill-op) * .35); }
.hm-edge { fill: none; stroke-width: .9; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .55; }
.hm-lab { font-family: var(--font-display); font-weight: 800; fill: var(--label); stroke: var(--halo); stroke-width: 3.5px; paint-order: stroke; text-anchor: middle; dominant-baseline: middle; pointer-events: none; letter-spacing: .04em; }
.hm-cap rect { fill: var(--panel); stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.hm-cap text { font-size: 11px; fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; pointer-events: none; }
.hm-person { cursor: pointer; }
.hm-person circle { stroke: #fff; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.hm-person text { font-size: 12px; font-weight: 700; fill: var(--ink); stroke: var(--halo); stroke-width: 3.5px; paint-order: stroke; }
.hm-person.sel circle { stroke: var(--ink); stroke-width: 2.5; }
.hm-trail { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; opacity: .75; pointer-events: none; }
.hm-stop circle { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.hm-stop text { font-size: 10.5px; fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; pointer-events: none; }
.hm-stop.now circle { fill: var(--accent); }
.hm-ev { cursor: pointer; }
.hm-ev path { stroke: #fff; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.hm-ev text { font-size: 11px; fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; }
.hm-yearbig { position: absolute; left: 12px; top: 8px; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--ink); text-shadow: 0 0 6px var(--halo), 0 0 2px var(--halo); }
.hm-yearbig small { display: block; font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.hm-tools { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.hm-tools button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); font-weight: 800; font-size: 17px; line-height: 1; }
.hm-views { position: absolute; left: 8px; bottom: 8px; right: 50px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.hm-views::-webkit-scrollbar { display: none; }
.hm-views .chip { box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.hm-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 260px; z-index: 5; }
.hm-bar { border-top: 1px solid var(--line); padding: 8px 12px 10px; display: grid; gap: 6px; background: var(--panel); flex: none; }
.hm-row { display: flex; align-items: center; gap: 8px; }
.hm { container-type: inline-size; }
@container (max-width: 820px) {
  .hm-row { flex-wrap: wrap; row-gap: 4px; }
  .hm .hm-slider { order: -1; flex: 1 1 100%; }
  .hm-row .yr { margin-left: auto; }
  .hm-steps .far { display: none; }
}
.hm-row .yr { font-family: var(--font-display); font-weight: 800; font-size: 20px; min-width: 92px; text-align: center; }
.hm-slider { flex: 1; position: relative; height: 34px; }
.hm-slider input { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; height: 34px; z-index: 2; }
.hm-slider input::-webkit-slider-runnable-track { height: 34px; background: transparent; }
.hm-slider input::-moz-range-track { height: 34px; background: transparent; }
.hm-slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 34px; border-radius: 6px; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.hm-slider input::-moz-range-thumb { width: 18px; height: 30px; border-radius: 6px; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.hm-ruler { position: absolute; left: 11px; right: 11px; top: 0; bottom: 0; border-radius: 6px; overflow: hidden; }
.hm-ruler .seg { position: absolute; top: 4px; bottom: 14px; opacity: .85; }
.hm-ruler .tick { position: absolute; bottom: 0; font-size: 9.5px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; font-family: var(--font-data); }
.hm-ruler .tick::before { content: ''; position: absolute; left: 50%; top: -4px; width: 1px; height: 4px; background: var(--muted); }
.hm-steps { display: flex; gap: 3px; flex: none; }
.hm-steps button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 7px; font-size: 12.5px; font-family: var(--font-data); }
.hm-play { width: 40px; height: 34px; border-radius: 9px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 15px; flex: none; }
.hm-eras { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.hm-eras::-webkit-scrollbar { display: none; }
.hm-eras button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; white-space: nowrap; flex: none; }
.hm-eras button.on { background: var(--ink); color: var(--panel); }
.hm-layers { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
@media (max-width: 720px) {
  .hm-row .yr { min-width: 70px; font-size: 17px; }
  .hm-steps .far { display: none; }
  .hm-yearbig { font-size: 26px; }
}

/* 地図の画面（右に説明） */
.mapview { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; height: calc(100vh - var(--top-h) - 36px); height: calc(100dvh - var(--top-h) - 36px); min-height: 520px; }
.mapview .hm { min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.side-body { flex: 1; overflow-y: auto; padding: 10px 14px 16px; min-height: 0; }
.side h2 { font-size: 21px; margin: 4px 0 2px; }
.side h3 { font-size: 15px; margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
.side p { margin: 6px 0; font-size: 14.5px; }
.lst { list-style: none; margin: 0; padding: 0; }
.lst li button { width: 100%; text-align: left; border: 0; background: none; padding: 5px 6px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.lst li button:hover { background: var(--chip); }
.lst .yrs { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--font-data); white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.backlink { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 2px 0; }
.places { list-style: none; padding: 0; margin: 6px 0; border-left: 2px solid var(--line); }
.places li { position: relative; padding: 3px 0 3px 14px; font-size: 13.5px; cursor: pointer; }
.places li::before { content: ''; position: absolute; left: -6px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ink); }
.places li.now::before { background: var(--accent); border-color: var(--accent); }
.places li b { font-family: var(--font-data); font-size: 12px; margin-right: 4px; }
@media (max-width: 900px) {
  .mapview { grid-template-columns: 1fr; grid-template-rows: minmax(330px, 62vh) auto; height: auto; }
  .side { max-height: none; }
  .side-body { max-height: 60vh; }
}

/* --- 年表 --- */
.chrono { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; height: calc(100vh - var(--top-h) - 36px); height: calc(100dvh - var(--top-h) - 36px); min-height: 480px; }
.chrono-main { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.chrono-head { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.chrono-svgwrap { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; min-height: 0; }
.chrono svg { display: block; width: 100%; touch-action: pan-y; user-select: none; }
.cb rect { rx: 4; cursor: pointer; }
.cb text { font-size: 11.5px; font-weight: 700; pointer-events: none; fill: #fff; }
.cb.light text { fill: #1f1d1a; }
.cb.sel rect { stroke: var(--ink); stroke-width: 2.5; }
.c-reg { font-family: var(--font-display); font-weight: 800; font-size: 13px; fill: var(--muted); }
.c-axis text { font-size: 10.5px; fill: var(--muted); font-family: var(--font-data); }
.c-axis line { stroke: var(--line); }
.c-cursor { stroke: var(--accent); stroke-width: 2; }
@media (max-width: 900px) { .chrono { grid-template-columns: 1fr; height: auto; } .chrono-main { height: 70vh; } }

/* --- 人物図鑑 --- */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.filters input[type=search] { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; min-width: 200px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.pcard { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-left: 6px solid var(--c, var(--accent)); border-radius: 10px; background: var(--panel); display: grid; gap: 2px; }
.pcard b { font-family: var(--font-display); font-size: 17px; }
.pcard .m { font-size: 12.5px; color: var(--muted); }
.pcard .t { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* --- クイズ --- */
.quiz { max-width: 860px; margin: 0 auto; }
.qbox { padding: 18px; }
.qbox h2 { font-size: 20px; margin: 0 0 12px; }
.qmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.qchoices { display: grid; gap: 8px; }
.qchoices button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.qchoices button.ok { background: color-mix(in srgb, var(--ok) 18%, var(--panel)); border-color: var(--ok); }
.qchoices button.ng { background: color-mix(in srgb, var(--ng) 16%, var(--panel)); border-color: var(--ng); }
.qres { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--chip); font-size: 14.5px; }
.qres .mark { font-size: 26px; font-weight: 800; margin-right: 6px; }
.qmap { height: 280px; margin-bottom: 12px; }
.qmap .hm-stage { height: 100%; }
.setup { display: grid; gap: 14px; padding: 18px; }
.setup .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.setup .row > b { min-width: 7em; }
.score { font-size: 46px; font-family: var(--font-display); font-weight: 800; color: var(--accent); }

/* --- 授業 --- */
.units { max-width: 980px; margin: 0 auto; display: grid; gap: 10px; }
.unit summary { cursor: pointer; padding: 12px 16px; font-family: var(--font-display); font-weight: 800; font-size: 17px; list-style: none; display: flex; gap: 10px; align-items: center; }
.unit summary::-webkit-details-marker { display: none; }
.unit summary::before { content: '▸'; color: var(--accent); }
.unit[open] summary::before { content: '▾'; }
.unit summary .prog { margin-left: auto; font-family: var(--font-body); font-size: 12.5px; color: var(--muted); font-weight: 500; }
.unit ol { margin: 0; padding: 0 12px 12px; list-style: none; display: grid; gap: 4px; }
.unit ol button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; }
.unit ol button .n { font-family: var(--font-data); color: var(--muted); font-size: 12.5px; }
.unit ol button .s { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
.unit ol button.done .n::after { content: ' ✓'; color: var(--ok); font-weight: 800; }
.course-head { max-width: 980px; margin: 0 auto 12px; }
.course-head h2 { margin: 0; font-size: 24px; }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; height: calc(100vh - var(--top-h) - 36px); height: calc(100dvh - var(--top-h) - 36px); min-height: 520px; }
.lesson-text { overflow-y: auto; padding: 14px 18px 24px; }
.lesson-text .crumb { font-size: 12.5px; color: var(--muted); }
.lesson-text h2 { font-size: 23px; margin: 4px 0 8px; }
.lesson-text .q { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border-left: 4px solid var(--accent); padding: 8px 12px; border-radius: 6px; font-weight: 700; }
.lesson-text h3 { font-size: 17px; margin: 18px 0 4px; }
.lesson-text p { margin: 4px 0; }
.lesson-text .think { margin-top: 16px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 10px; }
.lesson-nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 18px; }
.mapbtns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
