<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界史クロノマップ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8c2f39">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クロノマップ">
<meta name="description" content="歴史総合・世界史探究の授業で使える、年代のツマミを動かすと地図の王朝や人物が変わる世界史の学習アプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 見た目：古い地図帳のイメージ。紙の色の背景、明朝体の見出し、えんじ（アクセント）と藍 */
:root {
  --bg: #f3eee2;
  --panel: #fffdf7;
  --ink: #1f1d1a;
  --muted: #6a645a;
  --line: #dcd2bd;
  --chip: #ece5d4;
  --accent: #8c2f39;
  --accent-ink: #ffffff;
  --ai: #1f4e79;
  --ok: #2c8350;
  --ng: #c0392b;
  --sea: #d6e6ec;
  --land: #efe8d6;
  --land-line: #a99e84;
  --border: rgba(60, 50, 30, .16);
  --grat: rgba(140, 47, 57, 0.07);
  --label: #1f1d1a;
  --halo: rgba(255, 253, 247, .92);
  --fill-op: .5;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  /* 地図の中の文字は、端末に入っているフォントで（ウェブフォントは漢字ごとに少しずつ届き、届くたびに地図全体を描きなおすため） */
  --font-map: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", serif;
  --font-map-sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  --r: 12px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1e1b16; --ink: #ece6da; --muted: #a59d8e; --line: #3a342a; --chip: #2a261f;
    --accent: #e0848d; --accent-ink: #15130f; --ai: #7fb0dc; --ok: #5fd18f; --ng: #ff7b6b;
    --sea: #13212a; --land: #2d2a23; --land-line: #5d5546; --border: rgba(255, 245, 220, .14); --grat: rgba(224, 132, 141, .06);
    --label: #f6f1e6; --halo: rgba(20, 18, 14, .88); --fill-op: .55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1e1b16; --ink: #ece6da; --muted: #a59d8e; --line: #3a342a; --chip: #2a261f;
  --accent: #e0848d; --accent-ink: #15130f; --ai: #7fb0dc; --ok: #5fd18f; --ng: #ff7b6b;
  --sea: #13212a; --land: #2d2a23; --land-line: #5d5546; --border: rgba(255, 245, 220, .14); --grat: rgba(224, 132, 141, .06);
  --label: #f6f1e6; --halo: rgba(20, 18, 14, .88); --fill-op: .55;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  background: var(--bg); min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.35; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* --- 上のバー --- */
.top {
  position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.top-row { display: flex; align-items: center; gap: 12px; }
.brand { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
.brand a { color: inherit; text-decoration: none; }
.brand b { color: var(--accent); }
.brand small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.grpnav { display: flex; gap: 4px; flex-wrap: nowrap; align-items: center; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.grpnav::-webkit-scrollbar { display: none; }
.grpnav .g { border: 1px solid var(--line); background: var(--panel); padding: 5px 13px; border-radius: 999px; font-weight: 700; white-space: nowrap; flex: none; font-size: 14px; }
.grpnav .g[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grpnav .subs { display: inline-flex; gap: 2px; padding: 2px; margin: 0 4px; border-radius: 999px; background: var(--chip); flex: none; }
.grpnav .subs button { border: 0; background: transparent; padding: 4px 11px; border-radius: 999px; font-size: 13.5px; color: var(--muted); white-space: nowrap; font-weight: 600; }
.grpnav .subs button[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 13px; white-space: nowrap; }
/* スマホ：組の中の画面ボタンは2段目に（横にすべらせて全部見られる。端をうすくして続きがあるとわかるように） */
.subnav { display: flex; overflow-x: auto; scrollbar-width: none; margin-top: 6px; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 22px), transparent); }
.subnav[hidden] { display: none; }
.subnav::-webkit-scrollbar { display: none; }
.subnav .subs { display: inline-flex; gap: 2px; padding: 2px; margin: 0 8px; border-radius: 999px; background: var(--chip); flex: none; }
.subnav .subs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); white-space: nowrap; font-weight: 600; }
.subnav .subs button[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
@media (max-width: 720px) {
  .brand small, .lbl { display: none; }
  .brand { font-size: 18px; }
  .grpnav .g { padding: 4px 7px; font-size: 12.5px; }
  .grpnav { gap: 3px; }
  .brand { font-size: 16px; }
  .brand a { display: flex; flex-direction: column; line-height: 1.05; font-size: 11.5px; letter-spacing: .12em; }   /* スマホ：名前を2段に（世界史／クロノマップ） */
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .top-row .icon-btn { padding: 4px 8px; }
  .top-row { gap: 6px; }
  .top { padding-top: 6px; padding-bottom: 6px; }
}

main { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }

/* --- 共通の部品 --- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
button.chip[aria-pressed="true"], button.chip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.muted { color: var(--muted); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.2); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs button { border: 0; background: none; padding: 8px 12px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.keys { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.keys span { background: var(--chip); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.empty { color: var(--muted); padding: 12px; font-size: 14px; }

/* --- 歴史地図 --- */
.hm { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hm-stage { position: relative; flex: 1; min-height: 0; background: var(--sea); overflow: hidden; touch-action: none; }
.hm-pan { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; clip-path: inset(-50%); contain: layout style size; }   /* 画面の外は上下左右に半分まで（絵を大きくしすぎない） */
.hm-pan > svg { overflow: visible; }   /* 地図はいつも1枚の絵として用意（動かし始めに作りなおさない） */
.hm-stage svg, .hm-inset svg { font-family: var(--font-map-sans); }
.hm-stage svg .hm-plc text, .hm-stage svg .hm-lab, .hm-stage svg .st-lab { font-family: var(--font-map); }
.hm-stage svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.hm-sea { fill: var(--sea); }
.hm-grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hm-seamask { fill: var(--sea); stroke: var(--land-line); stroke-width: .6; vector-effect: non-scaling-stroke; pointer-events: none; }
.hm-land { fill: var(--land); stroke: var(--land-line); stroke-width: .6; vector-effect: non-scaling-stroke; }
.hm-modern { fill: none; stroke: var(--land-line); stroke-width: .5; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; opacity: .7; }
.hm-pol { fill-opacity: var(--fill-op); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; }   /* 色をふわっと変える効果は使わない（動かし始めに地図全体の描きなおしが続くため） */
.hm-pol.sel { fill-opacity: calc(var(--fill-op) + .2); stroke-width: 2.6; }
.hm-pol.dim { fill-opacity: calc(var(--fill-op) * .35); }
.hm-sph { stroke-width: 1.4; stroke-dasharray: 6 3; vector-effect: non-scaling-stroke; cursor: pointer; }
.hm-views .chip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.hm-views .chip.sub { background: color-mix(in srgb, var(--ai) 10%, var(--panel)); border-color: color-mix(in srgb, var(--ai) 35%, var(--line)); font-size: 12.5px; }
.hm-views .chip.sub.on { background: var(--ai); color: #fff; border-color: var(--ai); }
.pimg, .tipimg, .bigimg { display: inline-block; border-radius: 50%; object-fit: cover; object-position: center top; border: 2px solid var(--line); flex: none; background: var(--chip); }
.pimg { width: 30px; height: 30px; }
.tipimg { width: 44px; height: 44px; float: left; margin: 0 8px 2px 0; }
.bigimg { width: 108px; height: 108px; border-width: 3px; float: right; margin: 0 0 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.ini { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-display); font-weight: 800; border-color: transparent; }
.pimg.ini { font-size: 14px; } .bigimg.ini { font-size: 46px; } .tipimg.ini { font-size: 20px; }
.credit { font-size: 11px; color: var(--muted); clear: both; }
.credit a { color: inherit; }
.st-line { fill: none; stroke: #5b8db8; stroke-width: 4; stroke-linecap: round; opacity: .75; pointer-events: none; }
.st-route { fill: none; stroke-width: 3.2; stroke-linecap: round; pointer-events: none; filter: drop-shadow(0 0 2px var(--halo)); }
.st-mark { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.st-star { fill: #e8b400; stroke: #5a3d00; stroke-width: 1.2; }
.st-pulse { fill: none; stroke: #e8b400; stroke-width: 3; animation: stpulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes stpulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
.st-lab { font-size: calc(12px * var(--ls, 1)); font-weight: 700; fill: var(--ink); stroke: var(--halo); stroke-width: 3.5px; paint-order: stroke; pointer-events: none; }
.st-lab.main { font-size: calc(14px * var(--ls, 1)); font-weight: 800; }
.hm-relief { mix-blend-mode: multiply; opacity: .8; pointer-events: none; }
:root[data-theme="dark"] .hm-relief { opacity: .55; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hm-relief { opacity: .55; } }
.tr-mtn { fill: none; stroke: none; }
.tr-des { fill: #e3c27a; fill-opacity: .2; stroke: none; }
.tr-pla { fill: none; stroke: none; }
.tr-tun { fill: #b9c7c9; fill-opacity: .18; stroke: none; }
.tr-lake { fill: var(--sea); stroke: #7fa6c0; stroke-width: .5; vector-effect: non-scaling-stroke; }
.tr-riv { fill: none; stroke: #6f9fc4; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .85; pointer-events: none; }
:root[data-theme="dark"] .tr-riv { stroke: #4f7fa4; }
.tl-mtn text, .tl-pla text, .tl-tun text { font-size: calc(11.5px * var(--ls, 1)); fill: #7a5c38; font-style: italic; letter-spacing: .25em; stroke: var(--halo); stroke-width: 2.5px; paint-order: stroke; }
.tl-des text { font-size: calc(11.5px * var(--ls, 1)); fill: #9a7428; font-style: italic; letter-spacing: .25em; stroke: var(--halo); stroke-width: 2.5px; paint-order: stroke; }
.tl-riv text { font-size: calc(11px * var(--ls, 1)); fill: #3f78a6; font-style: italic; stroke: var(--halo); stroke-width: 2.5px; paint-order: stroke; }
.tl-city text { font-size: calc(10.5px * var(--ls, 1)); fill: var(--muted); stroke: var(--halo); stroke-width: 2.5px; paint-order: stroke; }
.tl-city circle { fill: var(--muted); }
.hm-inset { position: absolute; right: 52px; top: 8px; z-index: 3; border: 2px solid var(--panel); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.28); cursor: zoom-out; line-height: 0; }
.hm-inset .in-sea { fill: var(--sea); }
.hm-inset .in-land { fill: var(--land); stroke: var(--land-line); stroke-width: .4; }
.hm-inset .in-pol { fill-opacity: .55; stroke: none; }
.hm-inset .in-box { fill: rgba(200, 40, 40, .12); stroke: #c62828; stroke-width: 1.6; }
.hm-inset .in-dot { fill: #c62828; stroke: #fff; stroke-width: 1.2; }
.hm-inset text { font-size: 9px; font-weight: 700; text-anchor: middle; fill: var(--ink); stroke: var(--halo); stroke-width: 2px; paint-order: stroke; }
.hm-plc { cursor: pointer; }
.hm-plc path { fill: #8a5a2b; stroke: #fff; stroke-width: 1.2; }
.hm-plc.cap:not(.sel) path { display: none; }
.hm-plc.sel path { fill: var(--accent); }
.hm-plc text { font-family: var(--font-display); font-size: calc(12px * var(--ls, 1)); font-weight: 800; fill: #6b4423; stroke: var(--halo); stroke-width: 3px; paint-order: stroke; }
:root[data-theme="dark"] .hm-plc text { fill: #e2b98a; }
.hm-plc.sel text { fill: var(--accent); font-size: calc(14px * var(--ls, 1)); stroke: none; }
.hm-plc rect.selbg { fill: var(--panel); stroke: var(--accent); stroke-width: 1.4; opacity: .96; }
.hm-plc line.lead { stroke: var(--accent); stroke-width: 1.4; }
.hm-plc.sel path { transform: scale(1.5); }
.hm-edge { fill: none; stroke-width: .9; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .55; }
.hm-lab { font-family: var(--font-display); font-weight: 800; fill: var(--label); stroke: var(--halo); stroke-width: 3.5px; paint-order: stroke; text-anchor: middle; dominant-baseline: central; pointer-events: none; letter-spacing: .04em; }
.hm-cap rect { fill: var(--panel); stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.hm-cap text { font-size: calc(11px * var(--ls, 1)); font-weight: 700; fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; pointer-events: none; }
.hm-person { cursor: pointer; }
.hm-person .leg { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.hm-person circle { stroke: #fff; fill-opacity: 1; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.hm-person text { font-size: calc(12px * var(--ls, 1)); font-weight: 700; fill: var(--ink); stroke: var(--halo); stroke-width: 3.5px; paint-order: stroke; }
.hm-person.sel circle { stroke: var(--ink); stroke-width: 2.5; }
.hm-trail { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; opacity: .75; pointer-events: none; }
.hm-stop circle { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.hm-stop text { font-size: calc(10.5px * var(--ls, 1)); fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; pointer-events: none; }
.hm-stop.now circle { fill: var(--accent); }
.hm-ev { cursor: pointer; }
.hm-ev path { stroke: #fff; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.hm-ev text { font-size: calc(11px * var(--ls, 1)); font-weight: 700; fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; }
.hm-yearbig { position: absolute; left: 12px; top: 8px; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: calc(34px * var(--ls, 1)); line-height: 1; color: var(--ink); text-shadow: 0 0 6px var(--halo), 0 0 2px var(--halo); }
.hm-yearbig small { display: block; font-family: var(--font-body); font-size: calc(13px * var(--ls, 1)); font-weight: 700; color: var(--muted); margin-top: 4px; }
.hm-tools { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.hm-tools button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); font-weight: 800; font-size: 17px; line-height: 1; }
.hm-tools .gear { font-size: 16px; }
.hm-tools .gear[aria-expanded="true"] { background: var(--ink); color: var(--panel); }
.hm-set { position: absolute; right: 50px; top: 8px; z-index: 6; width: 236px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 22px rgba(0,0,0,.22); padding: 8px 12px 10px; font-size: 13.5px; max-height: calc(100% - 16px); overflow-y: auto; }
.hm-set-h { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 2px; }
.hm-set-h .x { border: 0; background: none; font-size: 15px; padding: 2px 4px; }
.hm-set-g { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; display: grid; gap: 3px; }
.hm-set-g b { font-size: 12px; color: var(--muted); }
.hm-set label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.hm-set input { accent-color: var(--accent); width: 16px; height: 16px; }
.hm-speed { display: flex; gap: 4px; }
.hm-speed button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 0; font-family: var(--font-data); }
.hm-speed button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hm-views { position: absolute; left: 8px; bottom: 8px; right: 50px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.hm-views::-webkit-scrollbar { display: none; }
/* 地域のボタン：ふだんはかくす。地図を動かしたときなどに、うすく出てしばらくして消える */
.hm-views { opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .35s, transform .35s; }
.hm.views-show .hm-views { opacity: .82; transform: none; pointer-events: auto; }
.hm.views-show .hm-views:hover, .hm.views-show .hm-views:focus-within { opacity: 1; }
.hm-views .chip.near { border-color: var(--ai); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ai) 45%, transparent); }
.hm-views .chip.near::before { content: '→ '; }
.hm.views-show .regbtn { background: var(--ink); color: var(--panel); }
.hm-tools .regbtn { font-size: 16px; }
.hm-views .chip { box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.hm-tip.ftip { left: 0; top: 0; opacity: 0; visibility: hidden; will-change: transform; contain: layout style paint; }
.hm-tip.ftip.on { opacity: 1; visibility: visible; }
