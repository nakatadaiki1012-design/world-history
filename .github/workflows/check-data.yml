# GitHub に送られるたびに、データが壊れていないかを自動で点検する（node tools/check-data.js）
# 壊れていると、GitHub の画面でこの点検が赤い ✕ になる
name: データの点検
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-data.js
